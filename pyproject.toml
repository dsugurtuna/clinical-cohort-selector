[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-cohort-selector"
version = "2.0.0"
description = "Build genotype-balanced, age-matched recall lists for clinical recall studies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ugur Tuna"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "mypy>=1.11"]

[project.scripts]
cohort-selector = "cohort_selector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 88
# legacy/ holds the original scripts, kept as published for reference.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
